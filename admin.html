<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>農藥肥料領用入庫系統－後台</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f2e6;--card:#fffdf7;--tx:#2a2a1f;--hd:#5a4326;--mu:#6f6b58;--bd:#e2dac3;--pr:#2d6a2f;--prt:#fff;--ac:#f0a313;--acl:#fdf1d3;--dg:#b83a2a;--ok:#e5f0dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1d15;--card:#252a1f;--tx:#ecebdd;--hd:#e8d7ae;--mu:#a5a891;--bd:#3b4230;--pr:#7fbf6a;--prt:#10200c;--ac:#f3b13a;--acl:#3a3320;--dg:#ee7b70;--ok:#27361f}}
:root[data-theme="dark"]{--bg:#1a1d15;--card:#252a1f;--tx:#ecebdd;--hd:#e8d7ae;--mu:#a5a891;--bd:#3b4230;--pr:#7fbf6a;--prt:#10200c;--ac:#f3b13a;--acl:#3a3320;--dg:#ee7b70;--ok:#27361f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body.back{--bg:#e9efe3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.back{--bg:#12150e}}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:linear-gradient(135deg,#1d4f26,#3b7a35);border-bottom:4px solid #f0a313}
.brand img{height:52px;max-width:calc(100% - 110px);object-fit:contain;object-position:left}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:#fff}
.acts a{color:#fff;text-decoration:none;padding:4px 10px;border:1px solid rgba(255,255,255,.55);border-radius:999px;opacity:.9;white-space:nowrap}
.acts div{display:flex;gap:6px;align-items:center}
.bar{padding:9px 16px;background:#173d1d;color:#fff;text-align:center;font-size:18px;font-weight:600;letter-spacing:2px}
main{max-width:780px;margin:0 auto;padding:14px}
main.back{max-width:1120px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.front .card{border-radius:16px;border-top:5px solid var(--ac);box-shadow:0 3px 10px rgba(90,67,38,.10)}
.front .card.rank{background:var(--acl)}
.back .card{border-radius:8px;box-shadow:none;border-top:3px solid var(--pr)}
h2{font-size:18px;margin:0 0 10px;color:var(--hd)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:16px}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:0}
.row{display:flex;gap:8px}.row>*{flex:1}
button.b{background:var(--pr);color:var(--prt);border:0;border-radius:8px;padding:11px 16px;font-size:16px;cursor:pointer}
.front button.b{border-radius:999px}
button.b.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.b.d{background:var(--dg);color:#fff}
button.sm{padding:6px 10px;font-size:14px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-top:8px;cursor:pointer;background:var(--card)}
.item:active{background:var(--acl)}
.item small,.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;background:var(--ok);padding:1px 8px;border-radius:6px;font-size:12px;margin-left:4px}
.msg{padding:10px;border-radius:8px;background:var(--ok);margin-bottom:12px}.msg.e{background:var(--dg);color:#fff}
.low{color:var(--dg);font-weight:600}
.scan{display:flex;gap:8px}.scan input{flex:1}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--ok);color:var(--hd)}
.adm{display:grid;grid-template-columns:176px 1fr;gap:16px;align-items:start}
.side{position:sticky;top:8px;background:var(--pr);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px}
.side button{background:transparent;color:var(--prt);border:0;text-align:left;padding:11px 12px;border-radius:6px;font-size:16px;cursor:pointer;opacity:.85}
.side button.on{background:rgba(255,255,255,.22);opacity:1;font-weight:700;box-shadow:inset 4px 0 0 var(--ac)}
.side a.sidelink{color:#fff;padding:11px 12px;text-decoration:none;opacity:.9;border-top:1px solid rgba(255,255,255,.3);margin-top:4px;display:block;font-size:16px}
@media (max-width:700px){.adm{display:block}.side{position:static;flex-direction:row;overflow-x:auto;margin-bottom:12px}.side button{white-space:nowrap}}
.card.cl>h2:first-child{cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center}
.card.cl>h2:first-child::after{content:'▾';font-size:14px;color:var(--mu);margin-left:8px}
.card.cl.closed>h2:first-child::after{content:'▸'}
.card.cl.closed>*:not(h2:first-child){display:none}
.card.cl.closed>h2:first-child{margin-bottom:0}
input[readonly]{opacity:.75}
body{-webkit-user-select:none;user-select:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
.big{font-size:20px}.big h2{font-size:24px}.big label{font-size:17px;margin-top:12px}.big .mu,.big .item small{font-size:17px}
.big .item{padding:14px;font-size:20px}.big .item b{font-size:24px;line-height:1.35}
.big input,.big select{font-size:21px;padding:14px}.big button.b{font-size:21px;padding:15px 20px}.big button.sm{font-size:17px;padding:8px 12px}
.big .msg{font-size:19px}
</style>
</head>

const genCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(12));let t='';for(const x of r)t+=a[x%a.length];return t.match(/.{4}/g).join('-')};

async function hash(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pf:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

async function submitOut(){
 if(!fsite)return setMsg('請先選擇場域',1);

 if(!(st.place||'').trim())return setMsg('請填寫使用地點或作物',1);
 const u=users.find(x=>x.id===st.person);if(!u)return setMsg('請選擇科室與領用人員',1);
 const items=[];
 for(const c of cart){const p=prods.find(x=>x.id===c.pid);if(!p||c.qty>(p.qty||0))return setMsg('庫存不足或資材已刪除：'+(p?ttl(p):''),1);items.push({p,n:c.qty})}
 const ts=Date.now(),place=st.place.trim();
 const batch=await nextNo(siteCode(fsite),'REQ');
 try{
  for(const {p,n} of items){
   const pr=Number(p.lastPrice)||0;
   await db.collection('products').doc(p.id).update({qty:Math.round(((p.qty||0)-n)*1000)/1000});
   await db.collection('logs').add({type:'out',batch,pid:p.id,name:ttl(p),cat:p.cat||'',unit:p.unit||'',floor:locOf(p),qty:n,note:'',place,dept:u.dept||'',site:fsite,vendor:'',price:p.lastPrice??'',amt:Math.round(n*pr*100)/100,agent:(st.agent||'').trim(),by:u.name,ts});
  }
  done={low:items.filter(({p,n})=>thr(p)>0&&(p.qty||0)-n<=thr(p)).map(({p,n})=>({t:ttl(p),q:(p.qty||0)-n,u:p.unit||''})),items:items.map(({p,n})=>({name:p.name,spec:p.spec||'',unit:p.unit||'',loc:locOf(p),n})),by:u.name,dept:u.dept||'',site:fsite,place,ts};
  cart=[];st={};sel=null;q='';render();
 }catch(e){setMsg('領用失敗：'+(e.message||e)+'（部分資材可能已扣庫存，請至後台紀錄核對）',1)}
}

let bd=null,zxr=null,camTimer=null,camStream=null;
try{if('BarcodeDetector' in window)bd=new BarcodeDetector()}catch(e){}
function zxDecode(c){
 if(!window.ZXing)return null;
 if(!zxr){const h=new Map(),F=ZXing.BarcodeFormat;h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.ITF,F.CODABAR,F.QR_CODE,F.DATA_MATRIX]);h.set(ZXing.DecodeHintType.TRY_HARDER,true);zxr=new ZXing.MultiFormatReader();zxr.setHints(h)}
 const lum=new ZXing.HTMLCanvasElementLuminanceSource(c);
 for(const B of [ZXing.HybridBinarizer,ZXing.GlobalHistogramBinarizer]){try{return zxr.decode(new ZXing.BinaryBitmap(new B(lum))).getText()}catch(e){}}
 return null;
}
async function decodeCanvas(c){
 if(bd){try{const r=await bd.detect(c);if(r.length)return r[0].rawValue}catch(e){}}
 return zxDecode(c);
}
function rotCanvas(c){const o=document.createElement('canvas');o.width=c.height;o.height=c.width;const g=o.getContext('2d');g.translate(c.height,0);g.rotate(Math.PI/2);g.drawImage(c,0,0);return o}
function fileToImg(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{res(i)};i.onerror=()=>rej(new Error('圖片格式無法讀取'));i.src=u})}
async function decodeFile(f){
 const img=await fileToImg(f),W=img.naturalWidth,H=img.naturalHeight;
 for(const max of [1280,1920,800,2400]){
  const sc=max/Math.max(W,H),w=Math.round(W*sc),h=Math.round(H*sc),c=document.createElement('canvas');
  c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(img,0,0,w,h);
  let code=await decodeCanvas(c);if(code)return code;
  code=await decodeCanvas(rotCanvas(c));if(code)return code;
 }
 return null;
}
async function readPhoto(f,cb){

  if(!code)return setMsg('未辨識到條碼。請靠近一點、對焦清楚、條碼橫放且完整入鏡、避免反光，或改按 📷 用相機即時掃描。',1);
  cb(code)}
 catch(e){setMsg('無法讀取這張圖片（iPhone 的 HEIC 格式可能不支援，請改用相機即時掃描）：'+(e.message||''),1)}
}
async function openCam(cb,fileSel){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){const f=document.querySelector(fileSel);f&&f.click();return}
 const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column';
 ov.innerHTML='<div style="position:relative;flex:1;min-height:0"><video id="camv" playsinline muted style="width:100%;height:100%;object-fit:cover"></video><div style="position:absolute;left:8%;right:8%;top:38%;height:24%;border:3px solid #f0a313;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)"></div><div style="position:absolute;top:12px;left:0;right:0;text-align:center;color:#fff;text-shadow:0 0 4px #000;font-size:16px">把條碼放進黃色框內，保持穩定、光線充足</div></div><div style="padding:12px;display:flex;gap:8px;background:#111"><button class="b s" id="camfile" style="flex:1">🖼 選圖片檔</button><button class="b" id="camx" style="flex:1">關閉</button></div>';
 document.body.appendChild(ov);
 let n=0,busy=false;
 const stop=()=>{clearInterval(camTimer);camTimer=null;if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}ov.remove()};
 document.getElementById('camx').onclick=stop;
 document.getElementById('camfile').onclick=()=>{stop();const f=document.querySelector(fileSel);f&&f.click()};
 try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false})}
 catch(e){stop();setMsg('無法開啟相機（電腦沒有相機、沒允許權限，或網址不是 https）。請改按旁邊的 🖼 選條碼圖片檔，或直接用 Ctrl+V 貼上圖片。',1);return}
 const v=document.getElementById('camv');v.srcObject=camStream;try{await v.play()}catch(e){}
 const c=document.createElement('canvas');
 camTimer=setInterval(async()=>{
  if(busy||!v.videoWidth)return;busy=true;
  try{c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
   let code=await decodeCanvas(c);if(!code&&(n++%2))code=await decodeCanvas(rotCanvas(c));
   if(code){stop();cb(code)}}catch(e){}
  busy=false;
 },350);
}

async function seedSite(site,withLoc){
 let n=0;const todo=SEED.map(r=>{const o={site:site.name,...seedMeta(r),loc:withLoc?(r[0]===4?'肥-'+String(r[1]).padStart(2,'0'):r[1]):'',name:r[2],conc:r[3],spec:r[4],unit:r[5]||'',barcode:'',note:'',qty:0,createdBy:(cu()||{}).name||'',createdAt:Date.now()};
  if(r[0]===4){o.n=r[7];o.p=r[8];o.k=r[9]}return{id:site.id+'-'+(r[0]===4?'f'+r[1]:'p'+r[1]+r[6]),o}});
 for(const o of OLD){try{await db.doc('products/'+site.id+'-'+o).delete()}catch(e){}}
 for(let i=0;i<todo.length;i+=5){await Promise.all(todo.slice(i,i+5).map(t=>db.doc('products/'+t.id).set(t.o)));n+=Math.min(5,todo.length-i)}
 return n;
}

async function doXfer(id){
 if(!canXfer())return setMsg('沒有調用權限',1);
 const src=allProds.find(p=>p.id===id);if(!src)return;
 const dest=xDest();if(!dest)return setMsg('請先選擇調入場域',1);
 if(dest===src.site)return setMsg('調出與調入不能是同一場域',1);
 const n=parseFloat(st['xq_'+id]);
 if(!(n>0))return setMsg('請輸入調用數量',1);
 if(n>(src.qty||0))return setMsg('來源庫存不足（現有 '+(src.qty||0)+'）',1);
 const dp=allProds.find(p=>p.site===dest&&((src.barcode&&p.barcode===src.barcode)||(p.name===src.name&&(p.spec||'')===(src.spec||''))));
 const who=cu().name,ts=Date.now(),pr=Number(src.lastPrice)||0,r3=x=>Math.round(x*1000)/1000;
 const docNo=await nextNo(siteCode(src.site),'XFER');
 const base={batch:docNo,name:ttl(src),cat:src.cat||'',unit:src.unit||'',qty:n,price:src.lastPrice??'',amt:Math.round(n*pr*100)/100,by:who,ts,place:'',dept:'',vendor:'',vcontact:'',note:'調撥：'+src.site+' → '+dest+(st.xnote?'｜'+st.xnote:'')};
 try{
  await db.collection('products').doc(src.id).update({qty:r3((src.qty||0)-n)});
  let did;
  if(dp){const u={qty:r3((dp.qty||0)+n)};if(src.lastPrice!==undefined&&src.lastPrice!=='')u.lastPrice=src.lastPrice;await db.collection('products').doc(dp.id).update(u);did=dp.id}
  else{const r=await db.collection('products').add({site:dest,cat:src.cat||'',use:src.use||'',name:src.name,conc:src.conc||'',spec:src.spec||'',unit:src.unit||'',barcode:src.barcode||'',note:src.note||'',loc:'',qty:n,n:src.n,p:src.p,k:src.k,lastPrice:src.lastPrice,createdBy:who,createdAt:ts,lastInBy:who,lastInAt:ts});did=r.id}
  await db.collection('logs').add({...base,type:'tout',pid:src.id,site:src.site,floor:locOf(src)});
  await db.collection('logs').add({...base,type:'tin',pid:did,site:dest,floor:dp?locOf(dp):''});
  st={xdest:isSuper()?dest:undefined};
  setMsg('已調用：'+ttl(src)+' '+n+(src.unit||'')+'，'+src.site+' → '+dest+(dp?'':'（'+dest+' 原本沒有此資材，已自動建立，請補上倉庫位置）'));
 }catch(e){setMsg('調用失敗：'+(e.message||e)+'（請至「紀錄」確認庫存是否已變動）',1)}
}

const logsF=()=>{
 const f=st.lfrom?new Date(st.lfrom+'T00:00:00').getTime():0,t=st.lto?new Date(st.lto+'T23:59:59').getTime():Infinity;

  const xfer=l.type==='tout'||l.type==='tin';

  return siteOk&&(logf==='all'||l.type===logf||(logf==='xfer'&&xfer))&&l.ts>=f&&l.ts<=t&&(!st.ldept||l.dept===st.ldept)&&(!st.lby||l.by===st.lby);
 });
};

async function auth(){
 if(Date.now()<lockUntil)return setMsg('嘗試次數過多，請 1 分鐘後再試',1);
 const id=$('#lid').value.trim().toLowerCase(),pw=$('#lpw').value;
 if(!id||!pw)return setMsg('請輸入帳號與密碼',1);
 try{
  const h=await hash(pw),u=users.find(x=>x.id===id&&x.role==='admin');
  if(!u&&!users.some(x=>x.role==='admin')&&id==='admin'&&pw==='admin'){
   const d={name:'管理員',role:'admin',level:'designer',pw:h,scope:'*'};await db.doc('users/admin').set(d);users.push({id:'admin',...d});
  }else if(!u||u.pw!==h){if(++tries>=5){lockUntil=Date.now()+60000;tries=0}return setMsg('帳號或密碼錯誤',1)}
  me=id;try{sessionStorage.setItem('fs_me',id)}catch(x){}
  sub='in';render();
 }catch(e){setMsg('登入失敗：'+(e.message||e),1)}
}

 if(e.target.id==='q'){q=e.target.value;limP=30;renderList()}
 else if(e.target.dataset.k==='xq'){st.xq=e.target.value;const x=$('#xres');if(x)x.innerHTML=xferRes()}
 else if(e.target.dataset.k)st[e.target.dataset.k]=e.target.value;
});
document.addEventListener('paste',e=>{
 const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(x=>x.type&&x.type.startsWith('image/'));if(!it)return;
 const f=it.getAsFile();if(!f)return;
 if($('#f_barcode')){e.preventDefault();readPhoto(f,c=>{$('#f_barcode').value=c})}
 else if($('#q')){e.preventDefault();readPhoto(f,scanCode)}
});
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter')return;
 const t=e.target;
 if(t.id==='q'){e.preventDefault();const v=t.value.trim();if(!v)return;
  const ex=prods.find(p=>p.barcode===v);lastCode=v;
  if(ex)scanCode(v);else{const r=match(v);if(r.length===1){if(inProd())editing=r[0];else pickProd(r[0].id);q='';render();document.querySelector('[data-k=qty]')?.focus()}}}
 else if(t.dataset.k==='qty'){e.preventDefault();mode()==='out'?addCart():move(false)}
 else if(t.id==='lpw'){auth()}
});
document.addEventListener('change',async e=>{
 const t=e.target,k=t.dataset.k;
 if(t.dataset.uf){try{await db.collection('users').doc(t.dataset.uid).update({[t.dataset.uf]:t.value})}catch(x){setMsg('更新失敗：'+(x.message||x),1)}return}
 if(t.dataset.scf){try{await db.collection('sites').doc(t.dataset.sid).update({code:t.value.trim().toUpperCase()})}catch(x){setMsg('更新失敗：'+(x.message||x),1)}return}
 if(k==='vendor'){st.vendor=t.value;if(!st.vcontact){const p=prods.find(x=>x.id===sel),c=vInfo(p&&p.site,t.value);if(c){st.vcontact=c;render()}}return}
 if(k==='asite'){asite=t.value;try{sessionStorage.setItem('fs_asite',asite)}catch(x){}sel=null;q='';st={};render();return}
 if(k){st[k]=t.value;if(k==='dept'||k==='site'||k==='es'){st.person='';if(k==='es')st.ed='';render()}else if(['lfrom','lto','lsite','ldept','lby','xdest'].includes(k))render();return}
 const f=t.files&&t.files[0];if(!f)return;t.value='';
 if(t.id==='file'||t.id==='fileup')readPhoto(f,scanCode);
 else if(t.id==='file2'||t.id==='file2up')readPhoto(f,c=>{$('#f_barcode').value=c});
});
</script>
</body>
</html>
